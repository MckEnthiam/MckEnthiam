<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes float {
      0%   { transform: translateY(0px);    opacity: 0; }
      8%   { opacity: 0.8; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-280px); opacity: 0; }
    }
    @keyframes floatB {
      0%   { transform: translateY(0px);    opacity: 0; }
      8%   { opacity: 0.6; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(-280px); opacity: 0; }
    }
    @keyframes floatC {
      0%   { transform: translateY(0px);    opacity: 0; }
      8%   { opacity: 0.9; }
      90%  { opacity: 0.75; }
      100% { transform: translateY(-280px); opacity: 0; }
    }

    .b1  { animation: float  4.2s ease-in infinite 0.0s; }
    .b2  { animation: floatB 5.5s ease-in infinite 0.7s; }
    .b3  { animation: floatC 3.8s ease-in infinite 1.4s; }
    .b4  { animation: float  6.0s ease-in infinite 2.1s; }
    .b5  { animation: floatB 4.7s ease-in infinite 0.3s; }
    .b6  { animation: floatC 5.1s ease-in infinite 1.8s; }
    .b7  { animation: float  3.5s ease-in infinite 2.9s; }
    .b8  { animation: floatB 4.9s ease-in infinite 0.9s; }
    .b9  { animation: floatC 5.8s ease-in infinite 3.3s; }
    .b10 { animation: float  4.3s ease-in infinite 1.1s; }
    .b11 { animation: floatB 3.9s ease-in infinite 2.5s; }
    .b12 { animation: floatC 5.3s ease-in infinite 0.5s; }
    .b13 { animation: float  4.6s ease-in infinite 3.8s; }
    .b14 { animation: floatB 6.2s ease-in infinite 1.6s; }
    .b15 { animation: floatC 4.0s ease-in infinite 4.2s; }
  </style>

  <!-- Bulle 1 — cyan, grande -->
  <circle class="b1" cx="55"  cy="280" r="22" fill="none" stroke="#4dd9f0" stroke-width="1.5"/>
  <circle class="b1" cx="48"  cy="272" r="5"  fill="white" opacity="0.3"/>

  <!-- Bulle 2 — lavande, moyenne -->
  <circle class="b2" cx="130" cy="285" r="14" fill="none" stroke="#b39ddb" stroke-width="1.5"/>
  <circle class="b2" cx="124" cy="279" r="3"  fill="white" opacity="0.3"/>

  <!-- Bulle 3 — rose, petite -->
  <circle class="b3" cx="200" cy="288" r="9"  fill="none" stroke="#f48fb1" stroke-width="1.2"/>
  <circle class="b3" cx="196" cy="284" r="2"  fill="white" opacity="0.35"/>

  <!-- Bulle 4 — aqua, grande -->
  <circle class="b4" cx="265" cy="278" r="26" fill="none" stroke="#26c6da" stroke-width="1.5"/>
  <circle class="b4" cx="256" cy="268" r="6"  fill="white" opacity="0.28"/>

  <!-- Bulle 5 — jaune, petite -->
  <circle class="b5" cx="330" cy="287" r="10" fill="none" stroke="#fff176" stroke-width="1.2"/>
  <circle class="b5" cx="326" cy="283" r="2.5" fill="white" opacity="0.3"/>

  <!-- Bulle 6 — vert clair, moyenne -->
  <circle class="b6" cx="395" cy="283" r="17" fill="none" stroke="#a5d6a7" stroke-width="1.5"/>
  <circle class="b6" cx="388" cy="276" r="4"  fill="white" opacity="0.3"/>

  <!-- Bulle 7 — bleu clair, petite -->
  <circle class="b7" cx="455" cy="289" r="8"  fill="none" stroke="#64b5f6" stroke-width="1.2"/>
  <circle class="b7" cx="452" cy="285" r="2"  fill="white" opacity="0.4"/>

  <!-- Bulle 8 — lilas, grande -->
  <circle class="b8" cx="520" cy="276" r="24" fill="none" stroke="#ce93d8" stroke-width="1.5"/>
  <circle class="b8" cx="511" cy="267" r="5.5" fill="white" opacity="0.28"/>

  <!-- Bulle 9 — orange doux, moyenne -->
  <circle class="b9" cx="585" cy="284" r="15" fill="none" stroke="#ffcc80" stroke-width="1.5"/>
  <circle class="b9" cx="579" cy="278" r="3.5" fill="white" opacity="0.3"/>

  <!-- Bulle 10 — cyan, petite -->
  <circle class="b10" cx="640" cy="287" r="10" fill="none" stroke="#4dd9f0" stroke-width="1.2"/>
  <circle class="b10" cx="636" cy="283" r="2.5" fill="white" opacity="0.35"/>

  <!-- Bulle 11 — rose, grande -->
  <circle class="b11" cx="700" cy="279" r="20" fill="none" stroke="#f48fb1" stroke-width="1.5"/>
  <circle class="b11" cx="692" cy="271" r="4.5" fill="white" opacity="0.28"/>

  <!-- Bulle 12 — lavande, petite -->
  <circle class="b12" cx="755" cy="288" r="9"  fill="none" stroke="#b39ddb" stroke-width="1.2"/>
  <circle class="b12" cx="751" cy="284" r="2"  fill="white" opacity="0.35"/>

  <!-- Bulle 13 — vert aqua, moyenne -->
  <circle class="b13" cx="95"  cy="284" r="13" fill="none" stroke="#4db6ac" stroke-width="1.5"/>
  <circle class="b13" cx="89"  cy="278" r="3"  fill="white" opacity="0.3"/>

  <!-- Bulle 14 — blanche, très petite -->
  <circle class="b14" cx="165" cy="289" r="7"  fill="none" stroke="#e0e0e0" stroke-width="1.2"/>
  <circle class="b14" cx="162" cy="285" r="1.5" fill="white" opacity="0.5"/>

  <!-- Bulle 15 — jaune, grande -->
  <circle class="b15" cx="740" cy="282" r="18" fill="none" stroke="#fff176" stroke-width="1.5"/>
  <circle class="b15" cx="733" cy="274" r="4"  fill="white" opacity="0.28"/>
</svg>
